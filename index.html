// Change as plain words with an arrow: ↓ 26.4% down, ↑ 2.4% up, No change

const fillVar = t => t === 'ok' ? 'var(--fern)' : t === 'warn' ? 'var(--porsche)' : 'var(--' + t + ')'; // brand colours for bars and fills
const cx = (...a) => a.filter(Boolean).join(' ');
const num = n => Math.round(n).toLocaleString('en-US');
const ngn = n => 'NGN ' + num(n);
const sod = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtDay = ts => new Date(ts).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const fmtFull = ts => fmtDay(ts) + ', ' + fmtTime(ts);
const isoDate = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
// Plain durations people can read at a glance: 15 mins, 3 hrs, 1 hr 24 mins, 4 days
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)); if (m < 60) return plural(m, 'min'); const h = Math.floor(m / 60), r = m % 60; if (h < 48) return plural(h, 'hr') + (r ? ' ' + plural(r, 'min') : ''); const d = Math.floor(h / 24), hr = h % 24; return plural(d, 'day') + (hr ? ' ' + plural(hr, 'hr') : ''); };
const relAgo = (ts, now) => { const h = (now - ts) / H; if (h < 1) return dur(Math.max(60e3, now - ts)) + ' ago'; if (h < 48) return plural(Math.round(h), 'hr') + ' ago'; return plural(Math.round(h / 24), 'day') + ' ago'; };

/* ============================ 1 CONFIG ============================ */

/* ============================ 2 SEED DATA ============================ */
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const ACCT_DEFS = [
  { id: 'brightpay', name: 'Brightpay Microfinance', segment: 'Key', am: 'Amaka Eze', agreed: 12000, run: 1, seed: 11, price: 38, industry: 'Microfinance bank', since: 'Feb 2025',

function genSeries(def) {
  const r = rng(def.seed); const out = {};
  Object.keys(def.mix).forEach(svc => {
    const base = def.agreed * def.run * def.mix[svc] / 24.4;
    out[svc] = Array.from({ length: 90 }, (_, i) => {
      const ago = 90 - i; const dow = new Date(DEMO_NOW - ago * D).getDay();
      const wk = (dow === 0 || dow === 6) ? .35 : 1;
      return Math.max(0, Math.round(base * wk * def.mod(svc, ago) * (0.9 + r() * 0.2)));
    });
  });
  return out;
}
const sum = a => a.reduce((x, y) => x + y, 0);
function monthSum(total, month) { return sum(total.filter((_, i) => new Date(DEMO_NOW - (90 - i) * D).getMonth() === month)); }

function computeSignals(list, incidents) {
  const out = [];
  list.forEach(a => {
    if (isNewAcct(a)) return; // new accounts ramp up for 30 days before usage signals apply
    const th = ACTIVE.th[a.segment]; const s = a.stats; const pct = s.last30 / a.agreed * 100;
    let sig = null;
    if (s.daysSinceLast >= th.dropDays) sig = { kind: 'Dropped', detail: 'No requests for ' + s.daysSinceLast + ' days. Last 30 days: ' + num(s.last30) + ' against ' + num(a.agreed) + ' agreed per month.' };
    else if (pct < th.lowPct) sig = { kind: 'Low volume', detail: num(s.last30) + ' requests in the last 30 days against ' + num(a.agreed) + ' agreed (' + p1(pct) + '%).' };
    else if (s.mom * 100 <= -th.reducedPct) sig = { kind: 'Reduced volume', detail: 'Down ' + p1(-s.mom * 100) + '% on the previous 30 days (' + num(s.prior30) + ' to ' + num(s.last30) + ').' };
    else {
      const sv = s.svcStats.filter(x => x.change7 * 100 <= -(ACTIVE.th.svcType[SVC[x.id].type] || th.reducedPct) && x.prior30 > 1000).sort((x, y) => x.change7 - y.change7)[0];
      if (sv) {
        const inc = ACTIVE.supp ? incidents.find(i => i.status === 'Open' && i.service === sv.id) : null;
        sig = { kind: 'Reduced volume', service: sv.id, detail: SVC[sv.id].name + ' requests are down ' + p1(-sv.change7 * 100) + '% over the last 7 days.' };
        if (inc) { sig.suppressed = true; sig.incident = inc; }

    }
    if (sig) out.push({ accountId: a.id, segment: a.segment, ...sig });
  });

}

const Icon = ({ n, s = 16, className = '' }) => html`<svg viewBox="0 0 24 24" width=${s} height=${s} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true"><path d=${ICONS[n]} /></svg>`;

const Pill = ({ tone = 'mute', children, className = '', title }) => html`<span title=${title} className=${cx('inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-medium whitespace-nowrap', TONES[tone], className)}>${children}</span>`;

const Card = ({ children, className = '' }) => html`<section className=${cx('rounded-lg border border-line bg-surface', className)}>${children}</section>`;

const Btn = ({ children, onClick, kind = 'default', disabled, className = '', title }) => html`<button title=${title} disabled=${disabled} onClick=${onClick} className=${cx('inline-flex items-center justify-center gap-1.5 rounded-md px-3 py-1.5 text-xs font-medium border transition-colors disabled:opacity-45 disabled:cursor-not-allowed', kind === 'primary' ? 'bg-brand text-onbrand border-brand hover:opacity-90' : 'bg-surface text-ink border-line hover:bg-surface2', className)}>${children}</button>`;

/* ============================ 6 SHARED WIDGETS ============================ */
const SegPill = ({ segment }) => html`<${Pill} tone=${segment === 'Key' ? 'info' : 'mute'}>${segment}<//>`;
const HealthPill = ({ h }) => html`<${Pill} tone=${HEALTH[h].tone}><span className="inline-block w-1.5 h-1.5 rounded-full" style=${{ background: 'currentColor' }}></span>${HEALTH[h].label}<//>`;

function SlaClock({ c, now, compact }) {
  const el = ((c.resolvedAt || now) - c.openedAt) / H, p = el / c.slaHours, st = slaState(p), rem = c.slaHours - el;
  const tone = st === 'breached' ? 'bad' : st === 'near' && !c.resolvedAt ? 'warn' : 'ok';
  const remTxt = c.resolvedAt ? 'Clock stopped' : rem > 0 ? fmtDur(rem * H) + ' left' : fmtDur(-rem * H) + ' over the standard';
  return html`<div className="min-w-[190px]">
    <div className="flex items-center justify-between gap-2 text-xs mb-1"><span className="font-medium tabular-nums">${fmtDur(el * H)} of ${hLabel(c.slaHours)}</span><${Pill} tone=${tone}>${c.resolvedAt ? (st === 'breached' ? 'Outside standard' : 'Within standard') : st === 'breached' ? 'Missed' : st === 'near' ? 'Near breach' : 'On track'}<//></div>
    <div className="relative h-2 rounded-full bg-surface2 overflow-hidden"><div className="h-full rounded-full" style=${{ width: Math.min(100, p * 100) + '%', background: fillVar(tone) }}></div>
      <div className="absolute top-0 h-full w-px bg-ink opacity-40" style=${{ left: '50%' }}></div><div className="absolute top-0 h-full w-px bg-ink opacity-40" style=${{ left: '80%' }}></div></div>
    ${!compact && html`<div className="text-[11px] text-mute mt-1 tabular-nums">${remTxt}</div>`}
  </div>`;
}

function VolumeSpark({ data, w = 120, h = 32 }) {
  const max = Math.max(...data, 1); const step = w / (data.length - 1);
  const pts = data.map((v, i) => (i * step).toFixed(1) + ',' + (h - 2 - (v / max) * (h - 4)).toFixed(1)).join(' ');
  return html`<svg width=${w} height=${h} viewBox=${'0 0 ' + w + ' ' + h} aria-hidden="true"><polyline points=${pts} fill="none" style=${{ stroke: 'var(--brand)' }} strokeWidth="1.5" /></svg>`;
}

function Tile({ label, value, sub, children, tone }) {
  return html`<div className="rounded-lg border border-line bg-surface p-3.5 flex flex-col gap-1 min-w-0">
    <div className="text-xs text-mute">${label}</div>
    <div className=${cx('text-2xl font-semibold tabular-nums', tone === 'bad' && 'text-bad', tone === 'warn' && 'text-warn')}>${value}</div>
    ${sub && html`<div className="text-xs text-mute">${sub}</div>`}${children}
  </div>`;
}

function CaseRow({ c, now, go }) {
  const a = ACC[c.accountId];
  return html`<div className="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 border-b border-line last:border-0 hover:bg-surface2 cursor-pointer" onClick=${() => go({ page: 'escalations', focus: c.id })}>

      <div className="text-xs text-mute mt-0.5">${c.issue}</div>
      <div className="text-[11px] text-mute mt-0.5">${c.type} · with ${c.owner} · ${c.status}</div>
    </div>
    <${SlaClock} c=${c} now=${now} />

        <div className="flex gap-3 text-xs mt-1"><span className="text-ok">${hc.green} healthy</span><span className="text-warn">${hc.amber} at risk</span><span className="text-bad">${hc.red} critical</span></div>
      <//>

      <${Tile} label="Tasks due today" value=${myTasks.length} sub=${myTasks.filter(t => t.auto).length + ' created automatically'} />
      <${Tile} label="Volume, last 30 days" value=${p1(actualTot / agreedTot * 100) + '% of agreed'} sub=${num(actualTot) + ' of ' + num(agreedTot)}><${VolumeSpark} data=${portfolio30} w=${140} /><//>

      <div className="lg:col-span-2 space-y-5 min-w-0">

              <div className=${cx('mt-0.5 w-8 h-8 rounded-md flex items-center justify-center shrink-0', TONES[tone])}><${Icon} n=${s.suppressed ? 'lock' : 'trend'} s=${16} /></div>
              <div className="min-w-0 flex-1">
                <div className="flex flex-wrap items-center gap-2 text-sm"><span className="font-semibold">${a.name}</span><${SegPill} segment=${a.segment} /><${Pill} tone=${tone}>${s.suppressed ? 'Suppressed · ' + s.kind : s.kind}<//>${role === 'HEAD' && html`<span className="text-xs text-mute">AM: ${a.am}</span>`}</div>
                <p className="text-xs text-mute mt-1">${s.detail}</p>

        <//>
        <${Card}>
          <${CardHead} title="Open escalations" right=${html`<${Pill} tone="auto"><${Icon} n="clock" s=${11} />Live<//>`} />
          ${cases.length === 0 ? html`<${Empty}>No open escalations.<//>` : cases.sort((a, b) => slaPct(b, now) - slaPct(a, now)).map(c => html`<${CaseRow} key=${c.id} c=${c} now=${now} go=${go} />`)}

    entry: { ts, accountId: acc.id, to: c.name, subject: w.draft.subject, mode: auto ? 'Auto (templated)' : 'Approved by ' + by, auto, kind: w.kind },
    log: { actor: auto ? 'System' : by, auto, accountId: acc.id, text: (auto ? 'Templated check-in sent to ' : 'Approved and sent check-in to ') + c.name + ' (' + acc.name + '). Mock: no real email sent.' },
  };

function seedStage2() {
  const det = DEMO_NOW - 3 * H; const work = {}, timeline = [], sentLog = [], log = [];
  computeSignals(ACCOUNTS, INCIDENTS_SEED).forEach(s => {
    const acc = ACC[s.accountId];
    if (s.suppressed) { work[acc.id] = { status: 'Suppressed', kind: s.kind, detectedAt: det }; return; }
    const draft = makeCheckin(acc, s);
    if (acc.segment === 'Scale') {
      const w = { status: 'Sent', mode: 'auto', kind: s.kind, detectedAt: det, sentAt: det + 5 * 60e3, draft }; work[acc.id] = w;
      const b = buildSend(acc, w, w.sentAt, 'Auto', null);
      timeline.push({ ...b.item, id: 'tl-auto-' + acc.id }); sentLog.push({ ...b.entry, id: 'sl-' + acc.id }); log.push({ ...b.log, id: 'l-auto-' + acc.id, ts: w.sentAt });
    } else work[acc.id] = { status: 'Draft', kind: s.kind, detectedAt: det, draft };
  });
  return { work, timeline, sentLog, log };
}

const PERIODS = { 'Aug 2026': { m: 7, closed: true, code: '0826' }, 'Sep 2026': { m: 8, closed: true, code: '0926' }, 'Oct 2026': { m: 9, closed: false, code: '1026' } };

}
function validateRequest(a, period, services, adjust, cases) {

  const breached = (cases || []).filter(c => c.accountId === a.id && c.breached);

function packData(a, period, services) {

  for (let i = 0; i < 90; i++) { const d = new Date(DEMO_NOW - (90 - i) * D); if (d.getMonth() !== P.m) continue; const counts = {}; services.forEach(s => { counts[s] = a.series[s] ? a.series[s][i] : 0; }); days.push({ date: d.getTime(), counts }); }
  const lines = services.map(s => { const q = sum(days.map(r => r.counts[s])); return { svc: s, qty: q, unit: a.price, amount: q * a.price }; });
  const sub = sum(lines.map(l => l.amount)), vat = Math.round(sub * .075);

/* ----- opportunities ----- */
const OPP_THRESHOLD = 70;
const OPP_RULES = [
  { id: 'addr', name: 'Address verification bundle', products: ['DIGADDR', 'PHYADDR'], base: 50, evidence: /address|field officer|field agent|landmark|verify borrowers/i, test: a => (a.services.includes('NIN') || a.services.includes('BVN')) && !a.services.includes('DIGADDR') && !a.services.includes('PHYADDR') },
  { id: 'live', name: 'Liveness check cross-sell', products: ['LIVE'], base: 45, evidence: /fraud|selfie|impersonat|spoof/i, test: a => a.services.includes('NIN') && a.services.includes('BVN') && !a.services.includes('LIVE') },
  { id: 'commit', name: 'Commitment increase', products: [], base: 55, evidence: /increase|expand|growth|plan to|double/i, test: a => a.stats.last30 >= a.agreed },
];
const OPP_STAGES = ['Flagged', 'Approved and sent', 'Sales handoff', 'Addendum filed'];
const DISMISS_REASONS = ['Wrong timing', 'Customer is evaluating alternatives', 'Not relevant to this customer', 'Already offered', 'Other'];
const OPP_CTX = {
  savannah: { to: 'sa1', ctx: 'You mentioned that your field officers still visit borrowers to verify addresses, and that you plan to double disbursements before December.' },
  brightpay: { to: 'br3', ctx: 'You mentioned rolling out to field agents next month, and now that integration work is settling it is a good time to look at onboarding checks for them.' },
  meridian: { to: 'me1', ctx: 'You mentioned expecting to increase your commitment at renewal.' },
};
function oppEvidence(a, rule, timeline) {
  const items = timeline.filter(t => t.accountId === a.id).sort((x, y) => y.ts - x.ts);
  const ev = items.find(t => t.dir !== 'out' && rule.evidence.test(t.subject + ' ' + t.body));
  const facts = [];
  if (rule.id === 'addr' || rule.id === 'live') facts.push('Uses only ' + a.services.map(s => SVC[s].name).join(' and ') + ' from the catalogue.');
  if (rule.id === 'commit') facts.push('Running at ' + p1(a.stats.last30 / a.agreed * 100) + '% of agreed volume over the last 30 days.');
  if (ev) facts.push('Timeline, ' + fmtDay(ev.ts) + ': "' + ev.subject + '" from ' + ev.author + '.');
  facts.push(a.segment + ' account, ' + num(a.agreed) + ' requests agreed per month.');
  return { ev, facts, items };
}
function computeOpps(accts, ctx) {
  const out = [];
  accts.forEach(a => OPP_RULES.forEach(r => {
    if (!r.test(a)) return;
    const { ev, items } = oppEvidence(a, r, ctx.timeline); let score = r.base + (ev ? 25 : 0) + (a.segment === 'Key' ? 10 : 0);
    const l5 = items.slice(0, 5); if (l5.filter(t => t.tags.sentiment === 'Positive').length > l5.filter(t => t.tags.sentiment === 'Negative').length) score += 10;
    score = Math.min(100, score); if (score < OPP_THRESHOLD) return;
    const sig = ctx.signals.find(s => s.accountId === a.id); const w = ctx.sigWork[a.id]; let held = null;
    if (isNewAcct(a)) held = 'New account in its first 30 days. Upsell waits until usage settles.';
    else if (sig && sig.suppressed) held = 'Open incident ' + sig.incident.id + ' on ' + SVC[sig.service].name + '. Signals are suppressed, so no upsell yet.';
    else if (sig && !(w && w.status === 'Replied')) held = 'Open ' + sig.kind + ' signal. Held until the customer has replied to the check-in.';
    const near = ctx.cases.find(c => c.accountId === a.id && isOpen(c) && slaPct(c, ctx.now) >= .8);
    if (!held && near) held = 'Open escalation ' + near.id + ' is at ' + p1(slaPct(near, ctx.now) * 100) + '% of its SLA.';
    out.push({ key: a.id + ':' + r.id, accountId: a.id, rule: r.id, score, held });
  }));
  return out;
}
const oppCtx = (st, now) => ({ timeline: st.timeline, signals: computeSignals(ACCOUNTS, st.incidents), sigWork: st.sigWork, cases: st.escalations, now });

  st.onboarding.forEach(o => {

function NotifRow({ n, st, dispatch, go, compact }) {

      <div className="text-xs text-mute mt-0.5">${n.detail}</div><div className="text-[11px] text-mute mt-0.5">${relAgo(n.ts, now)}</div></div>

  </div>`;
}
function NotificationsPage({ st, dispatch, role, go }) {
  const now = useNow(); const all = buildNotifs(st, role, now); const [type, setType] = useState('All'); const [showDone, setShowDone] = useState(false);
  const open = all.filter(n => !st.read[n.id]); const types = [...new Set(all.map(n => n.type))];
  const list = all.filter(n => (type === 'All' || n.type === type) && (showDone || !st.read[n.id]));
