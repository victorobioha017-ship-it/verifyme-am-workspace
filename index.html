function genSeries(def) {
  const r = rng(def.seed); const out = {};
  Object.keys(def.mix).forEach(svc => {
    const base = def.agreed * def.run * def.mix[svc] / 24.4;
    out[svc] = Array.from({ length: 90 }, (_, i) => {
      const ago = 90 - i; const dow = new Date(DEMO_NOW - ago * D).getDay();
      const wk = (dow === 0 || dow === 6) ? .35 : 1;
      return Math.max(0, Math.round(base * wk * def.mod(svc, ago) * (0.9 + r() * 0.2)));
    });
  });
  return out;
}

  const autoCount = st.timeline.filter(t => t.auto).length;

    dispatch({ type: 'ADD_TIMELINE', ts: now, toast: 'Mock sync: ' + CH[c.channel].label.toLowerCase() + ' from ' + ct.name + ' added to the timeline.',
      item: { accountId: a.id, channel: c.channel, dir: 'in', contactId: ct.id, author: ct.name, ts: now, subject: c.subject, body: c.body, auto: true, tags: autoTag(c.subject + '. ' + c.body, 'in') },
      logs: [{ actor: 'System', auto: true, accountId: a.id, text: CH[c.channel].label + ' from ' + ct.name + ' synced to the ' + a.name + ' timeline, matched by contact.' }] });
  };
  const chips = [['all', 'All'], ['email', 'Email'], ['slack', 'Slack'], ['meeting', 'Notes']];
  const sel = 'rounded-md border border-line bg-surface px-2 py-1.5 text-xs';
  return html`<div className="grid lg:grid-cols-3 gap-5">
    <div className="lg:col-span-2 space-y-3 min-w-0">
      <${Card} className="p-3 space-y-2.5">
        <div className="flex items-center gap-2 rounded-md border border-line bg-bg px-2.5 py-1.5"><${Icon} n="search" s=${14} className="text-mute" /><input value=${q} onChange=${e => setQ(e.target.value)} placeholder="Search emails, Slack messages and notes" className="w-full bg-transparent text-sm outline-none" /></div>
        <div className="flex flex-wrap items-center gap-2">
          ${chips.map(([k, l]) => html`<button key=${k} onClick=${() => setCh(k)} className=${cx('px-2.5 py-1 rounded-full text-xs border', ch === k ? 'bg-brand text-onbrand border-brand' : 'border-line bg-surface')}>${l}</button>`)}
          <select value=${topic} onChange=${e => setTopic(e.target.value)} className=${sel} aria-label="Topic"><option value="all">Any topic</option>${TOPICS.map(t => html`<option key=${t[0]} value=${t[0]}>${t[0]}</option>`)}</select>
          <select value=${sent} onChange=${e => setSent(e.target.value)} className=${sel} aria-label="Sentiment"><option value="all">Any sentiment</option><option>Positive</option><option>Neutral</option><option>Negative</option></select>
          <select value=${range} onChange=${e => setRange(+e.target.value)} className=${sel} aria-label="Date range"><option value=${30}>Last 30 days</option><option value=${90}>Last 90 days</option></select>
          <label className="text-xs flex items-center gap-1"><input type="checkbox" checked=${commitOnly} onChange=${e => setCommitOnly(e.target.checked)} />Commitments</label>

      ${items.length === 0 ? html`<${Card}><${Empty}>Nothing matches these filters. Clear the search or widen the date range.<//><//>` : items.map(t => html`<${TlItem} key=${t.id} t=${t} a=${a} now=${now} />`)}

/* ----- check-in drafts and sends ----- */
const CHECKIN_CTX = {
  brightpay: { to: 'br1', ctx: 'I know you were moving onboarding to a new in-house screen and that API calls would change for a while.' },
  lumen: { to: 'lu1', ctx: 'I remember you were trialling another liveness provider on part of your traffic and that responses felt slower.' },
  orchid: { to: 'or2', ctx: 'I know the NIN provider downtime has made the last weeks hard for your enrolment team.' },

const REPLIES = {
  brightpay: 'Sorry for the silence. We moved onboarding to an in-house screen and API calls restart on 26 October. We will send the new volume forecast by Monday.',
  lumen: 'Thanks for checking in. We are still comparing providers on liveness and would like the benchmark pack. Can we meet next week to review accuracy and response times?',
  default: 'Thanks for checking in. It has been a quieter period for us, but we expect volumes to pick up. We will share an updated forecast next week.',
};
function makeCheckin(acc, s) {
  const cc = CHECKIN_CTX[acc.id]; const to = (cc && cc.to) || acc.contacts[0].id; const c = acc.contacts.find(x => x.id === to); const first = c.name.split(' ')[0]; const st = acc.stats;
  let fact;
  if (s.service) { const sv = st.svcStats.find(x => x.id === s.service); fact = 'your ' + SVC[s.service].name + ' requests are down ' + p1(-sv.change7 * 100) + '% over the last 7 days'; }
  else if (s.kind === 'Dropped') fact = 'we have not seen any requests from your integration for ' + st.daysSinceLast + ' days';
  else if (s.kind === 'Low volume') fact = 'your volume over the last 30 days is ' + num(st.last30) + ' requests against ' + num(acc.agreed) + ' agreed each month';
  else fact = 'your request volume is down ' + p1(-st.mom * 100) + '% on the previous 30 days';
  if (acc.segment === 'Scale') return { to, subject: 'Checking in on your VerifyMe usage', body: 'Hi ' + first + ',\n\nOur usage report shows ' + fact + '. Is everything working as expected on your side, or is there anything we can help with, such as integration support or adjusting your plan?\n\nReply to this email and ' + acc.am + ' will follow up.\n\nRegards,\nVerifyMe Account Management' };
  return { to, subject: 'Checking in on ' + acc.name.split(' ')[0] + ' and VerifyMe', body: 'Hi ' + first + ',\n\nI wanted to check in personally because ' + fact + '. ' + (cc && cc.ctx ? cc.ctx + ' ' : '') + 'Could we find 20 minutes this week to see whether anything has changed on your side, or whether there is something we can fix?\n\nBest regards,\n' + acc.am + '\nAccount Manager, VerifyMe' };
}
function buildSend(acc, w, ts, mode, by) {
  const c = acc.contacts.find(x => x.id === w.draft.to); const auto = mode === 'Auto';
  return {
    item: { accountId: acc.id, channel: 'email', dir: 'out', contactId: c.id, author: auto ? 'VerifyMe (automatic)' : by, ts, subject: w.draft.subject, body: w.draft.body.replace(/\n+/g, ' '), auto, tags: autoTag(w.draft.subject + '. ' + w.draft.body, 'out') },
    entry: { ts, accountId: acc.id, to: c.name, subject: w.draft.subject, mode: auto ? 'Auto (templated)' : 'Approved by ' + by, auto, kind: w.kind },
    log: { actor: auto ? 'System' : by, auto, accountId: acc.id, text: (auto ? 'Templated check-in sent to ' : 'Approved and sent check-in to ') + c.name + ' (' + acc.name + '). Mock: no real email sent.' },
  };
}
function seedStage2() {
  const det = DEMO_NOW - 3 * H; const work = {}, timeline = [], sentLog = [], log = [];
  computeSignals(ACCOUNTS, INCIDENTS_SEED).forEach(s => {
    const acc = ACC[s.accountId];
    if (s.suppressed) { work[acc.id] = { status: 'Suppressed', kind: s.kind, detectedAt: det }; return; }
    const draft = makeCheckin(acc, s);
    if (acc.segment === 'Scale') {
      const w = { status: 'Sent', mode: 'auto', kind: s.kind, detectedAt: det, sentAt: det + 5 * 60e3, draft }; work[acc.id] = w;
      const b = buildSend(acc, w, w.sentAt, 'Auto', null);
      timeline.push({ ...b.item, id: 'tl-auto-' + acc.id }); sentLog.push({ ...b.entry, id: 'sl-' + acc.id }); log.push({ ...b.log, id: 'l-auto-' + acc.id, ts: w.sentAt });
    } else work[acc.id] = { status: 'Draft', kind: s.kind, detectedAt: det, draft };
  });
  return { work, timeline, sentLog, log };
}

/* ----- invoices and logs ----- */
const PERIODS = { 'Aug 2026': { m: 7, closed: true, code: '0826' }, 'Sep 2026': { m: 8, closed: true, code: '0926' }, 'Oct 2026': { m: 9, closed: false, code: '1026' } };
const LOG_PACK_LIMIT = 50000;
const STANDARD_CLOCK_H = 1; // real: about 30 minutes to generate plus 30 minutes to confirm
function monthRecords(a, month, services) {
  let t = 0; for (let i = 0; i < 90; i++) { if (new Date(DEMO_NOW - (90 - i) * D).getMonth() === month) services.forEach(s => { t += a.series[s] ? a.series[s][i] : 0; }); } return t;
}
function validateRequest(a, period, services, adjust, cases) {
  const P = PERIODS[period]; const recs = monthRecords(a, P.m, services); const outside = services.filter(s => !a.services.includes(s));
  const breached = (cases || []).filter(c => c.accountId === a.id && c.breached);
  return [
    { id: 'period', label: 'Billing period is closed', pass: P.closed, detail: P.closed ? period + ' is a closed month.' : period + ' is still open (month to date), so the invoice is not final.' },
    { id: 'contract', label: 'Services are covered by the contract', pass: outside.length === 0, detail: outside.length ? 'Not in contract: ' + outside.map(s => SVC[s].name).join(', ') + '.' : 'All ' + services.length + ' services are in the contract.' },
    { id: 'size', label: 'Log pack is under ' + num(LOG_PACK_LIMIT) + ' records', pass: recs < LOG_PACK_LIMIT, detail: num(recs) + ' records compiled.' },
    { id: 'sla', label: 'No breached SLA case needing a service credit', pass: breached.length === 0, detail: breached.length ? breached.map(c => c.id).join(', ') + ' breached its SLA. Finance reviews any credit.' : 'No SLA breaches on this account.' },
    { id: 'adjust', label: 'No credit note or adjustment requested', pass: !adjust, detail: adjust ? 'Credit notes are outside the standard contract rules.' : 'Standard invoice and logs only.' },
  ];
}
function packData(a, period, services) {
  const P = PERIODS[period]; const days = [];
  for (let i = 0; i < 90; i++) { const d = new Date(DEMO_NOW - (90 - i) * D); if (d.getMonth() !== P.m) continue; const counts = {}; services.forEach(s => { counts[s] = a.series[s] ? a.series[s][i] : 0; }); days.push({ date: d.getTime(), counts }); }
  const lines = services.map(s => { const q = sum(days.map(r => r.counts[s])); return { svc: s, qty: q, unit: a.price, amount: q * a.price }; });
  const sub = sum(lines.map(l => l.amount)), vat = Math.round(sub * .075);
  return { days, lines, sub, vat, total: sub + vat, records: sum(lines.map(l => l.qty)) };
}
function seedStage3() {
  const mk = (id, accountId, period, services, adjust, raisedAt, extra, stepsFn) => {
    const a = ACC[accountId]; const checks = validateRequest(a, period, services, adjust, []);
    return { id, accountId, period, services, adjust, raisedBy: 'Amaka Eze', raisedAt, checks, standard: checks.every(c => c.pass), ...extra, steps: stepsFn };
  };
  const t1 = DEMO_NOW - 30 * H, t2 = DEMO_NOW - 5 * H;
  const reqs = [
    mk('REQ-301', 'lumen', 'Sep 2026', ['NIN', 'BVN', 'LIVE'], true, t2, { status: 'Awaiting Finance', reason: 'Credit notes are outside the standard contract rules' },
      [{ label: 'Request raised by Amaka Eze', ts: t2, auto: false }, { label: 'Validated against contract and SLA rules', ts: t2 + 6e4, auto: true }, { label: 'Outside standard rules: routed to Finance', ts: t2 + 6e4, auto: true }]),
    mk('REQ-298', 'northgate', 'Sep 2026', ['NIN', 'BVN', 'DIGADDR'], false, t1, { status: 'Delivered', reason: 'Standard request, auto-approved', readyAt: t1 + 6e4, deliveredAt: t1 + 42 * 6e4, method: 'Sent to customer' },
      [{ label: 'Request raised by Amaka Eze', ts: t1, auto: false }, { label: 'Validated against contract and SLA rules', ts: t1 + 3e4, auto: true }, { label: 'Within standard rules: auto-approved', ts: t1 + 4e4, auto: true }, { label: 'Invoice and log pack generated and archived to the account', ts: t1 + 6e4, auto: true }, { label: 'Sent to customer by Amaka Eze', ts: t1 + 42 * 6e4, auto: false }, { label: 'Customer receives. Request clock stops', ts: t1 + 42 * 6e4, auto: true }]),
  ];

  computeOpps(ACCOUNTS, { timeline: startTimeline(), signals: sigs, sigWork: seedStage2().work, cases: cs, now: DEMO_NOW }).forEach(o => { if (!o.held) seen[o.key] = DEMO_NOW - 2 * H; });
  const log = Object.keys(seen).map(k => { const [aid, rid] = k.split(':'); return { id: 'l-opp-' + aid, ts: DEMO_NOW - 2 * H, actor: 'System', auto: true, accountId: aid, text: 'Rule scan flagged "' + OPP_RULES.find(r => r.id === rid).name + '" for ' + ACC[aid].name + '. ' + ACC[aid].am + ' notified to review the drafted email.' }; });
  return { reqs, seen, log };
}

  meridian: { to: 'me1', ctx: 'You mentioned expecting to increase your commitment at renewal.' },

function oppEvidence(a, rule, timeline) {
  const items = timeline.filter(t => t.accountId === a.id).sort((x, y) => y.ts - x.ts);
  const ev = items.find(t => t.dir !== 'out' && rule.evidence.test(t.subject + ' ' + t.body));
  const facts = [];
  if (rule.id === 'addr' || rule.id === 'live') facts.push('Uses only ' + a.services.map(s => SVC[s].name).join(' and ') + ' from the catalogue.');
  if (rule.id === 'commit') facts.push('Running at ' + p1(a.stats.last30 / a.agreed * 100) + '% of agreed volume over the last 30 days.');
  if (ev) facts.push('Timeline, ' + fmtDay(ev.ts) + ': "' + ev.subject + '" from ' + ev.author + '.');
  facts.push(a.segment + ' account, ' + num(a.agreed) + ' requests agreed per month.');

function computeOpps(accts, ctx) {
  const out = [];
  accts.forEach(a => OPP_RULES.forEach(r => {
    if (!r.test(a)) return;
    const { ev, items } = oppEvidence(a, r, ctx.timeline); let score = r.base + (ev ? 25 : 0) + (a.segment === 'Key' ? 10 : 0);
    const l5 = items.slice(0, 5); if (l5.filter(t => t.tags.sentiment === 'Positive').length > l5.filter(t => t.tags.sentiment === 'Negative').length) score += 10;
    score = Math.min(100, score); if (score < OPP_THRESHOLD) return;
    const sig = ctx.signals.find(s => s.accountId === a.id); const w = ctx.sigWork[a.id]; let held = null;
    if (sig && sig.suppressed) held = 'Open incident ' + sig.incident.id + ' on ' + SVC[sig.service].name + '. Signals are suppressed, so no upsell yet.';
    else if (sig && !(w && w.status === 'Replied')) held = 'Open ' + sig.kind + ' signal. Held until the customer has replied to the check-in.';
    const near = ctx.cases.find(c => c.accountId === a.id && isOpen(c) && slaPct(c, ctx.now) >= .8);
    if (!held && near) held = 'Open escalation ' + near.id + ' is at ' + p1(slaPct(near, ctx.now) * 100) + '% of its SLA.';
    out.push({ key: a.id + ':' + r.id, accountId: a.id, rule: r.id, score, held });
  }));

}

    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3"><${Tile} label="New from Sales, not yet contacted" value=${fresh} tone=${fresh ? 'warn' : undefined} sub="Standard: contact within 30 mins" /><${Tile} label="In onboarding" value=${inOnb} sub="Standard: live within 5 days" /><${Tile} label="Open technical tickets" value=${openT.length} sub="First response within 20 mins" /><${Tile} label="Pushed to QA" value=${qa.length} sub="TSI keeps customer and AM updated" /></div>
    <${Card}><${CardHead} title="Onboarding pipeline" sub="From CRM assignment to AM handover" />
      ${onb.map(o => { const i = ONB_STAGES.indexOf(o.stage), done = o.stage === 'Handed to AM'; const am = o.segment === 'Key' ? 'Amaka Eze' : 'Segun Bakare';
        const clk = o.stage === 'Assigned' ? { openedAt: o.assignedAt, slaHours: ONB_RESP_H, resolvedAt: null } : { openedAt: o.assignedAt, slaHours: ONB_DAYS * 24, resolvedAt: o.liveAt || null };
        return html`<div key=${o.id} className="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 border-b border-line last:border-0">
          <div className="flex-1 min-w-[240px]"><div className="flex flex-wrap items-center gap-2 text-sm"><span className="font-semibold">${o.name}</span><${SegPill} segment=${o.segment} /><${Pill} tone=${done ? 'ok' : i === 0 ? 'warn' : 'info'}>${o.stage}<//></div>
            <div className="text-xs text-mute mt-0.5">${o.industry} · ${o.services.map(x => SVC[x].name).join(', ')} · assigned from Sales ${relAgo(o.assignedAt, now)}${o.respondedAt ? ' · contacted in ' + dur(o.respondedAt - o.assignedAt) : ''}${done ? ' · handed to ' + o.handedTo : ''}</div>
            <div className="flex gap-1 mt-2" aria-label=${'Stage ' + (i + 1) + ' of ' + ONB_STAGES.length}>${ONB_STAGES.map((g, k) => html`<span key=${g} title=${g} className="h-1.5 w-8 rounded-full" style=${{ background: k <= i ? 'var(--brand)' : 'var(--surface2)' }}></span>`)}</div></div>
          <div className="text-[11px] text-mute w-full sm:w-auto">${o.stage === 'Assigned' ? 'First contact' : 'Assignment to go-live'}<${SlaClock} c=${clk} now=${now} /></div>
          ${can && !done && html`<${Btn} kind=${o.stage === 'Live' ? 'primary' : 'default'} onClick=${() => dispatch({ type: 'ONB_NEXT', id: o.id, by: me.name, ts: now })}>${o.stage === 'Live' ? 'Hand over to ' + am : ONB_NEXT_LABEL[o.stage]}<//>`}
        </div>`; })}<//>
    <${Card}><${CardHead} title="Technical tickets" sub="First response within 20 mins. Resolution: L1 2 hrs, L2 3 hrs, L3 48 hrs with updates" />
      ${tickets.length === 0 ? html`<${Empty}>No technical tickets.<//>` : tickets.map(k => { const a = ACC[k.accountId], openNow = k.status !== 'Resolved';
        const clk = !k.ackAt && openNow ? { openedAt: k.openedAt, slaHours: TSI_FR_H, resolvedAt: null } : { openedAt: k.openedAt, slaHours: TSI_RES_H[k.level], resolvedAt: k.resolvedAt || null };
        return html`<div key=${k.id} className="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 border-b border-line last:border-0">
          <div className="flex-1 min-w-[240px]"><div className="flex flex-wrap items-center gap-2 text-sm"><span className="font-semibold">${k.id}</span><${Pill} tone="mute">${k.level}<//><${Pill} tone=${stTone[k.status]}>${k.status}<//><span className="text-mute">${a.name}</span></div>
            <div className="text-xs text-mute mt-0.5">${k.issue} · raised by ${k.raisedBy} ${relAgo(k.openedAt, now)}${k.ackAt ? ' · acknowledged in ' + dur(k.ackAt - k.openedAt) : ''}</div>
            ${k.status === 'Pushed to QA' && html`<div className="text-xs mt-1">With QA since ${relAgo(k.qaAt, now)}. TSI keeps the customer and ${a.am} updated.</div>`}</div>
          <div className="text-[11px] text-mute w-full sm:w-auto">${!k.ackAt && openNow ? 'First response' : 'Resolution'}<${SlaClock} c=${clk} now=${now} /></div>
          ${can && openNow && html`<div className="flex flex-wrap gap-2">${!k.ackAt && html`<${Btn} onClick=${() => dispatch({ type: 'TKT_ACT', id: k.id, act: 'ack', by: me.name, ts: now })}>Acknowledge<//>`}${k.status !== 'Pushed to QA' && k.ackAt && html`<${Btn} onClick=${() => dispatch({ type: 'TKT_ACT', id: k.id, act: 'qa', by: me.name, ts: now })}>Push to QA<//>`}<${Btn} kind="primary" onClick=${() => dispatch({ type: 'TKT_ACT', id: k.id, act: 'resolve', by: me.name, ts: now })}>Mark resolved<//></div>`}
        </div>`; })}<//>
    <${Card} className="p-3.5 text-xs text-mute"><span className="font-medium text-ink">Escalation path: </span>Customer or AM, then TSI (first line), then QA, then Product. QA and Product work outside this workspace; TSI owns the update to the customer and the AM.<//>
  </div>`;
}

// Screen registry: later stages register their screens here (and bump STAGE_DONE)
const SCREENS = { home: Home, accounts: AccountsPage, account: Account360, escalations: EscalationsPage, signals: SignalsPage, invoices: InvoicesPage, opportunities: OppsPage, reports: ReportsPage, dashboard: DashboardPage, tsi: TsiPage };

/* ============================ 8 APP SHELL ============================ */
function App() {
  const [st, dispatch] = useReducer(reducer, null, initState);
  ACTIVE.th = st.thresholds; ACTIVE.supp = st.suppOn;
  const [route, setRoute] = useState({ page: 'home' });
  const [guide, setGuide] = useState(false);
  const [tick, setTick] = useState(0);
  useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 10000); return () => clearInterval(t); }, []);
  useEffect(() => { if (!st.toast) return; const t = setTimeout(() => dispatch({ type: 'TOAST', text: null }), 4500); return () => clearTimeout(t); }, [st.toast && st.toast.id]);
  useEffect(() => { dispatch({ type: 'CLOCK_TICK', now: DEMO_NOW + st.simHours * H + (Date.now() - st.base) }); }, [st.simHours, tick]);
  useEffect(() => { dispatch({ type: 'OPP_SCAN', now: DEMO_NOW + st.simHours * H + (Date.now() - st.base) }); }, [st.sigWork, st.escalations, st.incidents, st.thresholds, st.suppOn, st.timeline, tick]);
  const now = DEMO_NOW + st.simHours * H + (Date.now() - st.base);
  const role = st.role; const me = ROLES[role];
  const go = r => { setRoute(r); window.scrollTo(0, 0); };
  const setRole = r => { dispatch({ type: 'SET_ROLE', role: r }); setRoute({ page: 'home' }); };
  const nav = NAV.filter(n => !n.roles || n.roles.includes(role));
  const planned = NAV.find(n => n.id === route.page && n.stage > STAGE_DONE);
  let screen;
  if (planned) screen = html`<${Planned} item=${planned} />`;
  else if (route.page === 'home' && role === 'TSI') screen = html`<${TsiPage} st=${st} dispatch=${dispatch} role=${role} />`;
  else if (route.page === 'home' && role === 'VS') screen = html`<${VsHome} st=${st} go=${go} />`;
  else if (route.page === 'home' && role === 'FIN') screen = html`<${FinHome3} st=${st} dispatch=${dispatch} go=${go} />`;
  else { const S = SCREENS[route.page] || Home; screen = html`<${S} st=${st} dispatch=${dispatch} go=${go} role=${role} route=${route} />`; }
  const active = route.page === 'account' ? 'accounts' : route.page;

  return html`<${NowCtx.Provider} value=${now}>
    <div className="min-h-screen flex">
      <aside className="hidden md:flex w-56 shrink-0 flex-col border-r border-line bg-surface sticky top-0 h-screen">
        <div className="px-4 py-4 border-b border-line"><div className="font-semibold text-sm leading-tight">VerifyMe</div><div className="text-xs text-mute">Account Management Workspace</div></div>
        <nav className="p-2 space-y-0.5 flex-1">${nav.map(n => { const locked = n.stage > STAGE_DONE; return html`<button key=${n.id} onClick=${() => go({ page: n.id })} className=${cx('w-full flex items-center gap-2.5 rounded-md px-2.5 py-2 text-sm text-left', active === n.id ? 'bg-brandsoft text-brand font-medium' : locked ? 'text-mute hover:bg-surface2' : 'hover:bg-surface2')}><${Icon} n=${n.icon} s=${16} /><span className="flex-1">${n.label}</span>${locked && html`<span className="text-[10px] rounded bg-surface2 text-mute px-1.5 py-0.5">Stage ${n.stage}</span>`}</button>`; })}</nav>
        <div className="p-3 text-[11px] text-mute border-t border-line">Concept prototype. All data and actions are mock. Currency in NGN.</div>
      </aside>
      <div className="flex-1 min-w-0 flex flex-col">
        <header className="sticky z-50 bg-surface border-b border-line" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
          <div className="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-2.5">
            <div className="md:hidden font-semibold text-sm">VerifyMe AM</div>
            <div className="flex items-center gap-2"><div className="w-8 h-8 rounded-full bg-brand text-onbrand flex items-center justify-center text-xs font-semibold">${me.name.split(' ').map(x => x[0]).join('')}</div><div className="leading-tight"><div className="text-sm font-medium">${me.name}</div><div className="text-xs text-mute">${me.title}</div></div></div>
            <div className="flex items-center gap-1.5 md:ml-auto" role="group" aria-label="Switch role"><span className="text-xs text-mute mr-1">View as</span>${ROLE_ORDER.map(r => html`<button key=${r} onClick=${() => setRole(r)} className=${cx('px-2.5 py-1.5 rounded-md text-xs font-medium border', role === r ? 'bg-brand text-onbrand border-brand' : 'bg-surface border-line hover:bg-surface2')}>${ROLES[r].short}</button>`)}</div>
            <${Btn} kind="primary" onClick=${() => setGuide(!guide)} title="Walk through the Brightpay story"><${Icon} n="spark" s=${12} />Guided demo<//>${st.simHours > 0 && html`<${Pill} tone="auto"><${Icon} n="clock" s=${11} />Clock +${fmtDur(st.simHours * H)}<//>`}<${Btn} onClick=${() => { dispatch({ type: 'RESET' }); setRoute({ page: 'home' }); }} title="Restore the initial demo data"><${Icon} n="reset" s=${12} />Reset demo<//>
          </div>
          <div className="md:hidden flex gap-1 px-3 pb-2 scroll-x">${nav.filter(n => n.stage <= STAGE_DONE).map(n => html`<button key=${n.id} onClick=${() => go({ page: n.id })} className=${cx('px-3 py-1 rounded-md text-xs border whitespace-nowrap', active === n.id ? 'bg-brandsoft text-brand border-brand' : 'border-line')}>${n.label}</button>`)}</div>
        </header>
        <main className="p-4 md:p-6 max-w-[1280px] w-full mx-auto">${screen}</main>
      </div>
      ${guide && html`<${GuidedDemo} st=${st} dispatch=${dispatch} go=${go} setRole=${setRole} now=${now} onClose=${() => setGuide(false)} />`}
      ${st.toast && html`<div key=${st.toast.id} className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] max-w-[90vw] rounded-lg bg-ink text-bg px-4 py-2.5 text-sm shadow-lg flex items-center gap-2" role="status"><${Icon} n="check" s=${15} />${st.toast.text}</div>`}
    </div>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
